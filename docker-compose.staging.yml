services:
  cursor2telegram:
    build:
      context: .
      dockerfile: Dockerfile
    image: cursor2telegram:staging
    container_name: cursor2telegram-staging
    restart: unless-stopped
    env_file:
      - /etc/cursor2telegram/env
    environment:
      CURSOR2TELEGRAM_CONFIG: /etc/cursor2telegram/config.toml
      CURSOR2TELEGRAM_LOG_LEVEL: ${CURSOR2TELEGRAM_LOG_LEVEL:-INFO}
      CURSOR_AGENT_BIN: /home/cursoragent/.local/bin/agent
    volumes:
      - /etc/cursor2telegram:/etc/cursor2telegram:ro
      - /var/lib/cursor2telegram:/var/lib/cursor2telegram
      - /var/log/cursor2telegram:/var/log/cursor2telegram
      - /home/cursoragent/.cursor:/home/cursoragent/.cursor
      - /home/cursoragent/.telegram-mcp:/home/cursoragent/.telegram-mcp
      - /opt/cursor2telegram/mcp:/opt/cursor2telegram/mcp:ro
    healthcheck:
      test: ["CMD", "cursor2telegram", "--check"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
