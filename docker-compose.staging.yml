services:
  cursor2telegram:
    image: python:3.12-slim-bookworm
    container_name: cursor2telegram-staging
    restart: unless-stopped
    user: "0:0"
    working_dir: /app
    network_mode: host
    env_file:
      - /etc/cursor2telegram/env
    environment:
      HOME: /root
      PATH: /root/.local/bin:/var/lib/cursor2telegram/staging-venv/bin:/usr/local/bin:/usr/local/sbin:/usr/sbin:/usr/bin:/sbin:/bin
      CURSOR2TELEGRAM_CONFIG: /etc/cursor2telegram/config.toml
      CURSOR2TELEGRAM_LOG_LEVEL: ${CURSOR2TELEGRAM_LOG_LEVEL:-INFO}
      CURSOR_AGENT_BIN: /root/.local/bin/agent
    volumes:
      - .:/app
      - /etc/cursor2telegram:/etc/cursor2telegram:ro
      - /var/lib/cursor2telegram:/var/lib/cursor2telegram
      - /var/log/cursor2telegram:/var/log/cursor2telegram
      - /root:/root
      - /opt/cursor2telegram/mcp:/opt/cursor2telegram/mcp:ro
    command:
      - bash
      - -lc
      - |
        set -euo pipefail
        python -m venv /var/lib/cursor2telegram/staging-venv
        /var/lib/cursor2telegram/staging-venv/bin/python -m pip install --upgrade pip wheel
        /var/lib/cursor2telegram/staging-venv/bin/python -m pip install -e /app
        exec /var/lib/cursor2telegram/staging-venv/bin/cursor2telegram
    healthcheck:
      test: ["CMD-SHELL", "/var/lib/cursor2telegram/staging-venv/bin/cursor2telegram --check"]
      interval: 60s
      timeout: 20s
      retries: 3
      start_period: 30s
