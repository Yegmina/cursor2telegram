[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor2telegram"
version = "0.1.0"
description = "Control Cursor CLI on your server from a Telegram bot, end-to-end."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [
  { name = "Yegmina", email = "Yegmina@users.noreply.github.com" },
]
keywords = ["cursor", "telegram", "agent", "acp", "automation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Communications :: Chat",
  "Topic :: Software Development :: Tools",
]
dependencies = [
  "python-telegram-bot[rate-limiter]>=21.6,<22",
  "httpx>=0.27",
  "openai>=1.0",
  "tomli>=2.0; python_version < '3.11'",
  "structlog>=24.1.0",
  "platformdirs>=4.0.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.23",
  "pytest-cov>=5.0",
  "ruff>=0.4.0",
  "mypy>=1.8",
]

[project.scripts]
cursor2telegram = "cursor2telegram.__main__:main"
c2t = "cursor2telegram.__main__:main"
c2t-admin = "cursor2telegram.admin:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"cursor2telegram" = ["py.typed"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "ASYNC", "S", "RUF"]
ignore = ["S101", "S603", "S607"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-ra -q"
